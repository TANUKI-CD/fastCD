# Builds the source distribution and the wheels and uploads them with PyPI
# trusted publishing. PyPI accepts tokens from GitHub Actions but not from
# Forgejo, so every job runs only on the GitHub mirror.
#
# A pushed version tag publishes to PyPI. A manual run publishes the selected
# branch or tag to TestPyPI. Neither index accepts a file name twice, so each
# rehearsal needs its own version in src/fastcd.c, such as 1.3.1rc1.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    if: github.server_url == 'https://github.com'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      # The build selection and the test command are in pyproject.toml
      - uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - run: pipx run build --sdist
      - name: Check that the tag names the packaged version
        if: github.ref_type == 'tag'
        run: test -f "dist/pyfastcd-${GITHUB_REF_NAME#v}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    if: github.server_url == 'https://github.com' && github.event_name == 'workflow_dispatch'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with: { pattern: "dist-*", path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: github.server_url == 'https://github.com' && github.event_name == 'push'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with: { pattern: "dist-*", path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
